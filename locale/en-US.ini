# R27-B1c: entries below have NO evidence-backed native copy; values stay as-is. This batch
# wires the keys and the refresh mechanism, not the translation. Replace values later per
# evidence/r27-b1c-i18n-scan/pending-copy.md -- no code change needed.
#
# NO-NATIVE version prefix (UILogin / UICharSelect / UIRaceSelect / UICommonCreation).
# The sites used to build "Ver. " + version; the loader trims both ends of a value, so that
# space has to live inside the template -- Locale::format's documented convention.
version.prefix=Ver. {}

# NO-NATIVE character-select ranking row. The source literal here was Chinese, so this file
# keeps that same Chinese value: we have no evidence for an English rendering either, and
# inventing one is the same mistake as inventing the Chinese one. Up/down suffixes stay in
# one template (not "number" + bare suffix) so a language can place the arrow word itself.
charselect.rank_unavailable=排行不可用
charselect.rank_up={} up
charselect.rank_down={} down
