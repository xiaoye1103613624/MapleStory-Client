# R27-B1c：以下条目**没有原生文案依据**，值先保持原样 —— 本批通的是「键位 + 机制」，
# 不是翻译。日后逐条取证（String.img / IDA / 原生截帧）只改 ini 的值，代码不用动。
# 逐条台账见 evidence/r27-b1c-i18n-scan/pending-copy.md。
#
# NO-NATIVE 版本号前缀（UILogin / UICharSelect / UIRaceSelect / UICommonCreation 四处同源）。
# 站点原来写的是 "Ver. " + 版本号；加载器会 trim 掉值两端空白，所以那个空格只能待在
# 模板里 —— 占位符两侧的空格由各语言自己决定，这是 Locale::format 的既定约定。
version.prefix=Ver. {}

# NO-NATIVE 角色选择窗「排行」行（本包自造中文，原生排行是另一套 UI，无对应文案依据）。
# 升降后缀同理：整条模板给 Locale::format，不拆成「数字 + 独立后缀」，否则中文会拿到
# "名次 上" 这种断不成句的东西，且值两端的空白会被 trim 掉。
charselect.rank_unavailable=排行不可用
charselect.rank_up={} up
charselect.rank_down={} down


# NO-NATIVE 地图侧栏（UIMapInfoPanel / UIMapMobPanel / UIMapDropPanel）。
# 这三块面板是本包自造的 UI，原生 v83 没有对应窗体，文案不存在依据；mappanel.mesos
# 与 mapdrop.unknown_item 的英文就是站点原值。
mappanel.select_monster=Select a monster
mappanel.no_monsters=No monsters on this map
mappanel.no_drop_data=No drop data
mappanel.mesos=mesos
mapdrop.unknown_item=Unknown

# NO-NATIVE 好友/黑名单窗（UIUserList）与查看全部角色（UIViewAllChar）。
# userlist.cur_location / viewallchar.world 带占位符：前半截是文案、后半截是数据，
# 拆开存会导致中文拿到「我的位置 - 世界1」这种半句。
userlist.none=none
userlist.cur_location=My Location - {}
userlist.default_group=Default Group (0/0)
viewallchar.world=World {}

