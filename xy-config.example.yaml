# 部署级配置示例（复制为可执行文件同目录 xy-config.yaml）
# 优先级高于 Settings。详见 docs/features/client-platform-masterplan/README.md

server:
  ip: 127.0.0.1
  port: 8484

window:
  # 登录/选角/世界/频道视口：恒 1280×720（Login.img/Common/frame 原生尺寸），不要改。
  width: 1280
  height: 720
  # 进入游戏后的分辨率：game_tier 取 0..8，顺序见 Util/ResolutionTiers.h：
  # 0 800x600 / 1 1024x768 / 2 1366x768 / 3 1600x900 / 4 1920x1080 /
  # 5 1280x720 / 6 1440x900 / 7 1680x1050 / 8 2560x1440
  # 255 = 未显式选档，按 game_width/game_height；档位超过桌面时自动回落最大可用档。
  # 不设置这三个键时，游戏态沿用登录尺寸 1280×720。
  game_width: 1280
  game_height: 720
  game_tier: 5

data:
  # 生产：显式 img。开发可用 auto / wz / nx。
  format: img
  dir: Data
  keymode: auto
  keyfile: ""

patch:
  enabled: true
  # 独立补丁站 manifest；空则跳过同步
  url: "http://127.0.0.1:8080/client/patch/manifest.json"
  channel: stable
  timeout_ms: 15000
  retries: 2
  allow_skip: true

boot:
  # 原生启动动画（经典客户端 Logo.img/Nexon 片头）总开关
  # 对应 ijl15.dll 的 RemoveLogos 语义（原版默认跳过），这里反过来默认开启。
  logo: true
  # 单帧时长（毫秒）；Nexon 共 137 帧，40ms ≈ 5.5s。任意按键/点击可跳过。
  frame_ms: 40

damage:
  # 原生取证补齐的伤害公式（魔法攻击 / 无视防御 / 暴击区间 / 玩家受伤）。
  # false = 保持旧 Fyms085 公式；改动玩法数值前请先备份配置。
  formula_v2: false
  # 12 字节/行伤害封包：int32 vanillaLine + int64 真实值。
  # 必须与 s9 服务端 gms.service.damage.long-lines 同时为 true/false，
  # 双端不一致会导致攻击包整体读错位。回滚时双端同时改回 false。
  long_lines: false
  # 单段伤害上限，默认 2^53（double 可精确表示的最大整数）。
  # 服务端下发破功值 0x3730 时取 min(cap, limitBreak)。
  cap: 9007199254740992
